# Intended path: /docker-compose.yml (project root, alongside /backend and /frontend)
version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: ww-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - ww-network

  backend:
    build:
      context: ./backend
      dockerfile: Backend.Dockerfile
    container_name: ww-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env.backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/wildflowersandwaves
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ww-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Frontend.Dockerfile
    container_name: ww-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env.frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ww-network

volumes:
  mongo-data:

networks:
  ww-network:
    driver: bridge
